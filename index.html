<style>
/* ============ CONFIGURACIÓN VISUAL ============ */
:root{
  --bg:#F7F5FB; --card:#FFFFFF; --ink:#2A2140; --muted:#6B6280; --line:#ECE8F3; --chip:#F1EEF6;
  --rosa1:#FF9EC4; --rosa2:#E5528F; --lila1:#C6B2FF; --lila2:#8A63E8; --dur1:#FFB38A; --dur2:#FF7E8A;
  --ok:#1E7A4C; --ok-bg:#E2F5EA; --warn:#8A5A00; --warn-bg:#FFF1D6; --bad:#B42D33; --bad-bg:#FDE7E8; --vio:#6A3FC9; --vio-bg:#EFE8FF;
  --font:"Plus Jakarta Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
body{min-height:100vh}
button,input,select{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.scr{padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .sub{font-size:13px;color:var(--muted);font-weight:500}
.back{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 2px 8px rgba(42,33,64,.06)}
.titlerow{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,var(--lila1),var(--rosa1));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
/* tarjeta principal */
.stackcard{position:relative;padding-bottom:14px}
.stackcard::before,.stackcard::after{content:"";position:absolute;bottom:0;height:40px;border-radius:22px}
.stackcard::before{left:18px;right:18px;background:#FFC3B3}
.stackcard::after{left:9px;right:9px;bottom:7px;background:#FFA894}
.bigcard{position:relative;z-index:1;border-radius:24px;background:linear-gradient(135deg,var(--dur1) 0%,var(--dur2) 100%);color:#fff;padding:22px 22px 0;overflow:hidden;box-shadow:0 14px 30px rgba(255,126,138,.35)}
.bigcard .tag{font-size:12px;font-weight:600;background:rgba(255,255,255,.25);padding:4px 10px;border-radius:99px}
.bigcard .amt{margin:10px 0 2px;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.bigcard .foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px -22px 0;padding:14px 22px 18px;background:rgba(120,30,60,.14)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.num{font-variant-numeric:tabular-nums}
/* acciones */
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0;font-size:12px;font-weight:600;color:var(--ink);position:relative}
.act .ic{width:58px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;right:calc(50% - 36px);min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--bg)}
.g-rosa{background:linear-gradient(135deg,#FF9EC4,#E5528F);box-shadow:0 8px 16px rgba(229,82,143,.3)}
.g-menta{background:linear-gradient(135deg,#8FE3D9,#34B3A6);box-shadow:0 8px 16px rgba(52,179,166,.3)}
.g-lila{background:linear-gradient(135deg,#C6B2FF,#8A63E8);box-shadow:0 8px 16px rgba(138,99,232,.3)}
.g-azul{background:linear-gradient(135deg,#8EC5FF,#4A86E8);box-shadow:0 8px 16px rgba(74,134,232,.3)}
.g-ambar{background:linear-gradient(135deg,#FFD9A0,#F5A623);box-shadow:0 8px 16px rgba(245,166,35,.3)}
.g-rojo{background:linear-gradient(135deg,#FF9F9F,#E0464B);box-shadow:0 8px 16px rgba(224,70,75,.3)}
.g-indigo{background:linear-gradient(135deg,#B9A4F5,#6F7BF7);box-shadow:0 8px 16px rgba(111,123,247,.3)}
.g-verde{background:linear-gradient(135deg,#A6E3A1,#3FA45B);box-shadow:0 8px 16px rgba(63,164,91,.3)}
/* filas y tarjetas */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;border:0;width:100%;text-align:left;font-size:14px}
button.row{cursor:pointer}
.row .grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.ph{width:52px;height:52px;border-radius:14px;flex:none;object-fit:cover;background:linear-gradient(135deg,#EDE7F7,#D9CFF0);display:flex;align-items:center;justify-content:center;color:#8C80A6;font-weight:800;font-size:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-warn{color:var(--warn);background:var(--warn-bg)} .p-bad{color:var(--bad);background:var(--bad-bg)} .p-vio{color:var(--vio);background:var(--vio-bg)} .p-mute{color:var(--muted);background:var(--chip)}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:24px 12px;background:var(--card);border-radius:18px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #E2DCEC;background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* controles */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:50px;border-radius:14px;border:1px solid #E2DCEC;background:var(--card);padding:0 14px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.inp:focus,.chip:focus-visible,.btn:focus-visible,.act:focus-visible,button.row:focus-visible,.back:focus-visible,.step button:focus-visible{outline:3px solid var(--lila1);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:52px;border-radius:16px;border:0;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:linear-gradient(135deg,var(--rosa2),var(--lila2));color:#fff}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:var(--card);color:var(--ink);border:1px solid #E2DCEC}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wide{width:100%}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:38px;height:38px;border-radius:19px;border:1px solid #E2DCEC;background:var(--card);font-size:19px;font-weight:700;cursor:pointer;line-height:1}
.step button.plus{background:var(--lila2);border-color:var(--lila2);color:#fff}
.step input{width:46px;height:38px;border:0;background:transparent;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
/* encabezado de color */
.band{margin:calc(-18px - env(safe-area-inset-top,0px)) -20px 0;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 24px;border-radius:0 0 32px 32px;color:#fff;display:flex;flex-direction:column;gap:16px}
.band .back{background:rgba(255,255,255,.22);box-shadow:none;color:#fff}
.b-lila{background:linear-gradient(150deg,#8A63E8 0%,#C35BC0 100%)}
.b-rosa{background:linear-gradient(150deg,#E5528F 0%,#FF8E6E 100%)}
.b-menta{background:linear-gradient(150deg,#2FA79A 0%,#6FCF97 100%)}
.b-ambar{background:linear-gradient(150deg,#E8912A 0%,#F5B94A 100%)}
.b-rojo{background:linear-gradient(150deg,#C7363C 0%,#F07067 100%)}
.b-indigo{background:linear-gradient(150deg,#5C68E8 0%,#9B7BF0 100%)}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i{display:block;height:8px;border-radius:4px;background:#fff}
/* barra fija de guardar */

  if(foco && $(foco)){ const el=$(foco); el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} }
  enlazar();
}
function encabezado(titulo, color, extra=""){
  return `<div class="band ${color}"><div class="titlerow"><button class="back" data-go="inicio" aria-label="Volver a inicio">${svg("back",22,2.2)}</button><h1>${titulo}</h1></div>${extra}</div>`;
}

/* ---------- INICIO ---------- */
function vInicio(){
  const f=hoy(), ini=lunes(new Date()).getTime();
  let vHoy=0,pHoy=0,vSem=0,fSem=0;
  for(const m of calc.movs){
    if(m.t==="venta"){ const imp=(+m.q)*(+m.precio||0); if(m.dia===f){vHoy+=imp;pHoy+=+m.q;} if(m.ts>=ini) vSem+=imp; }
    if(m.t==="conteo" && m.ts>=ini && (+m.dif)<0) fSem+=(-m.dif)*(+m.costo||0);
  }
  const surt=porSurtir(), falt=faltRecientes(7), pend=activos().filter(([id])=>pendiente(id)).length;
  const at=[];
  falt.slice(-3).reverse().forEach(m=>at.push(`<button class="row" data-go="faltantes"><span class="dot" style="background:#8A63E8"></span><span class="grow"><span class="t">${esc(nombreP(m.p))}</span><span class="s">Conteo del ${fTxt(m.dia)}</span></span><span class="pill p-vio">Faltó ${-m.dif}</span></button>`));
  surt.slice(0,4).forEach(([id,p])=>{const [e,c]=estado(id); at.push(`<button class="row" data-go="surtir"><span class="dot" style="background:${c==="p-bad"?"#E0464B":"#F5A623"}"></span><span class="grow"><span class="t">${esc(p.nombre)}</span><span class="s">Quedan ${num(stockDe(id))} · mínimo ${num(p.minimo)}</span></span><span class="pill ${c}">${e}</span></button>`);});
  if(pend) at.push(`<button class="row" data-go="conteo"><span class="dot" style="background:#4A86E8"></span><span class="grow"><span class="t">${pend} productos sin contar</span><span class="s">En los últimos 7 días</span></span><span class="pill p-mute">Contar</span></button>`);
  const A=(go,ic,g,t,badge)=>`<button class="act" data-go="${go}"><span class="ic ${g}" style="color:#fff">${svg(ic,26)}</span>${badge?`<span class="badge">${badge}</span>`:""}${t}</button>`;
  const ini2 = (aj.nombre||"MC").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return `<section class="scr">
    <div class="top"><div><div class="sub">Hola${aj.nombre?", "+esc(aj.nombre):""}</div><h1>Inicio</h1></div><button class="avatar" data-go="ajustes" aria-label="Ajustes">${esc(ini2)}</button></div>
    ${ejemploAviso()}
    <div class="stackcard"><div class="bigcard">
      <div class="top"><span style="font-size:15px;font-weight:700">Ventas de hoy</span><span class="tag">${esc(aj.sucursal||"Mi tienda")}</span></div>
      <div class="amt">${money(vHoy)}</div><div style="font-size:13px;opacity:.9">${num(pHoy)} piezas</div>
      <div class="foot"><div><div class="lbl">Semana</div><div class="num" style="font-size:17px;font-weight:700">${money(vSem)}</div></div>
      <div><div class="lbl">Faltantes</div><div class="num" style="font-size:17px;font-weight:700">${fSem?"−"+money(fSem):money(0)}</div></div></div>
    </div></div>
    <div style="display:flex;flex-direction:column;gap:14px"><h2>Acciones</h2><div class="acts">
      ${A("vender","vender","g-rosa","Vender")}${A("entrada","entrada","g-menta","Entrada")}${A("conteo","conteo","g-lila","Conteo",pend||"")}${A("productos","productos","g-azul","Productos")}
      ${A("surtir","surtir","g-ambar","Por surtir",surt.length||"")}${A("faltantes","faltantes","g-rojo","Faltantes",falt.length||"")}${A("reportes","reportes","g-indigo","Reportes")}<button class="act" id="btnExcelIni"><span class="ic g-verde" style="color:#fff">${svg("excel",26)}</span>Excel</button>
    </div></div>
    <div style="display:flex;flex-direction:column;gap:10px"><h2>Atender hoy</h2><div class="list">${at.join("")||`<div class="empty">Todo en orden: sin faltantes ni productos por surtir.</div>`}</div></div>
  </section>`;
}
function ejemploAviso(){
  return Object.values(st.productos).some(p=>p.ejemplo) ? `<div class="row" style="background:var(--vio-bg)"><span class="grow"><span class="t" style="color:var(--vio)">Estás viendo datos de ejemplo</span><span class="s">Bórralos en Ajustes cuando cargues tus productos.</span></span><button class="btn btn-soft" style="height:40px;font-size:13px" data-go="ajustes">Ajustes</button></div>` : "";
}

/* ---------- VENDER / ENTRADA ---------- */

/* ---------- CONTEO ---------- */

  const cats=categorias();
  const filas=activos().filter(([id,p])=> ui.cat==="__pend" ? (pendiente(id)||ui.borr[id]!==undefined) : ui.cat==="__todos" ? true : (p.categoria||"Sin categoría")===ui.cat);
  const chip=(v,t)=>`<button class="chip" data-cat="${esc(v)}" aria-pressed="${ui.cat===v}">${esc(t)}</button>`;
  return `<section class="scr" style="padding-bottom:110px">
    ${encabezado("Conteo","b-lila",`<div style="display:flex;flex-direction:column;gap:8px"><div class="top" style="font-size:13px;font-weight:600"><span>Contados esta semana</span><span class="num">${hechos} de ${tot}</span></div><div class="prog"><i style="width:${tot?Math.round(hechos/tot*100):0}%"></i></div></div>`)}
    <div class="chips">${chip("__pend","Pendientes")}${chip("__todos","Todos")}${cats.map(c=>chip(c,c)).join("")}</div>
    <p class="hint">Cuenta lo que hay en anaquel y escribe la cantidad. Hazlo después de registrar las ventas del día.</p>
    <div class="list">${filas.map(([id,p])=>{const v=ui.borr[id], s=stockDe(id); const d=(v===undefined||v==="")?null:(+v)-s;
      const pl = d===null?["Sin contar","p-mute"]:d<0?["Faltan "+(-d),"p-bad"]:d>0?["Sobran "+d,"p-warn"]:["Cuadra","p-ok"];
      return `<div class="row">${fotoHtml(p)}<span class="grow"><span class="t">${esc(p.nombre)}</span><span class="s">Sistema: ${num(s)}</span><span><span class="pill ${pl[1]}" id="pl_${esc(id)}">${pl[0]}</span></span></span>
        <span class="step"><button type="button" data-cmenos="${esc(id)}" aria-label="Restar uno">−</button><input type="number" inputmode="numeric" min="0" id="c_${esc(id)}" data-cin="${esc(id)}" value="${v??""}" placeholder="–" aria-label="Contado ${esc(p.nombre)}"><button type="button" class="plus" data-cmas="${esc(id)}" aria-label="Sumar uno">+</button></span></div>`}).join("") || `<div class="empty">${ui.cat==="__pend"?"Todos los productos se contaron esta semana.":"No hay productos en esta categoría."}</div>`}</div>
  </section>
  <div class="savebar"><div class="in"><div style="flex:1;min-width:0"><div class="hint" id="cRes"></div><div style="font-size:20px;font-weight:800" class="num" id="cTot"></div></div><button class="btn btn-main" id="cGuardar">Guardar conteo</button></div></div>`;
}
function resumenConteo(){
  const ids=Object.keys(ui.borr).filter(k=>ui.borr[k]!==""&&prod(k)); let f=0,v=0;
  ids.forEach(id=>{const d=(+ui.borr[id])-stockDe(id); if(d<0){f+=-d; v+=-d*(+prod(id).costo||0);}});
  if($("cRes")){ $("cRes").textContent = ids.length ? `${ids.length} contados · ${f?f+" faltante"+(f>1?"s":""):"sin faltantes"}` : "Captura al menos un producto";
    $("cTot").textContent = ids.length ? (f?"−"+money(v):"Todo cuadra") : ""; $("cTot").style.color = f?"var(--bad)":"var(--ok)"; $("cGuardar").disabled=!ids.length; }
}
function pillConteo(id){ const v=ui.borr[id], s=stockDe(id), d=(v===undefined||v==="")?null:(+v)-s;
  const pl = d===null?["Sin contar","p-mute"]:d<0?["Faltan "+(-d),"p-bad"]:d>0?["Sobran "+d,"p-warn"]:["Cuadra","p-ok"];
  const el=$("pl_"+id); if(el){ el.textContent=pl[0]; el.className="pill "+pl[1]; } }

/* ---------- PRODUCTOS ---------- */

/* ---------- FALTANTES ---------- */
function vFaltantes(){
  const l=calc.movs.filter(m=>m.t==="conteo"&&(+m.dif)!==0&&Date.now()-m.ts<30*DIA).reverse();
  let v=0,pz=0; l.forEach(m=>{if(m.dif<0){v+=-m.dif*(+m.costo||0);pz+=-m.dif;}});
  return `<section class="scr">

    <div class="list">${l.map(m=>`<div class="row">${fotoHtml(prod(m.p))}<span class="grow"><span class="t">${esc(nombreP(m.p))}</span><span class="s">${fTxt(m.dia)} ${hora(m.ts)} · sistema ${num(m.esperado)}, contado ${num(m.contado)}</span><span><span class="pill ${m.dif<0?"p-bad":"p-warn"}">${m.dif<0?"Faltan "+(-m.dif):"Sobran "+m.dif}</span> <span class="s">${money(Math.abs(m.dif)*(+m.costo||0))}</span></span></span><button class="btn btn-danger" style="height:38px;padding:0 12px;font-size:13px" data-undo="${esc(m.dia)}|${esc(m.id)}">Deshacer</button></div>`).join("") || `<div class="empty">Sin diferencias en los últimos 30 días.</div>`}</div>
  </section>`;
}

/* ---------- REPORTES ---------- */
function periodo(){ const n=new Date(); let de,a;
  if(ui.per==="sem"){ de=lunes(n); a=new Date(de.getTime()+6*DIA); }
  else if(ui.per==="ant"){ a=new Date(lunes(n).getTime()-DIA); de=lunes(a); }
  else { de=new Date(n.getFullYear(),n.getMonth(),1); a=new Date(n.getFullYear(),n.getMonth()+1,0); }
  return {de:dstr(de), a:dstr(a)}; }
function datosPeriodo(){ const {de,a}=periodo(); const ms=calc.movs.filter(m=>m.dia>=de&&m.dia<=a);
  const vp=new Map(); let ventas=0,piezas=0,gan=0,comp=0,fv=0,fp=0;
  for(const m of ms){ if(m.t==="venta"){const imp=m.q*(+m.precio||0); ventas+=imp; piezas+=m.q; gan+=imp-m.q*(+m.costo||0); const r=vp.get(m.p)||{q:0,imp:0}; r.q+=m.q; r.imp+=imp; vp.set(m.p,r);}
    if(m.t==="entrada") comp+=m.q*(+m.costo||0); if(m.t==="conteo"&&m.dif<0){fp+=-m.dif; fv+=-m.dif*(+m.costo||0);} }
  return {de,a,ms,vp,ventas,piezas,gan,comp,fv,fp}; }
function vReportes(){
  const d=datosPeriodo(); const top=[...d.vp.entries()].sort((x,y)=>y[1].imp-x[1].imp).slice(0,10);
  const max=top.length?top[0][1].imp:1;
  const chip=(v,t)=>`<button class="chip" data-per="${v}" aria-pressed="${ui.per===v}">${t}</button>`;
  return `<section class="scr">
    <div class="top"><div><div class="sub">${fTxt(d.de)} al ${fTxt(d.a)}</div><h1>Reportes</h1></div></div>
    <div class="chips">${chip("sem","Esta semana")}${chip("ant","Semana pasada")}${chip("mes","Este mes")}</div>
    <div class="kpis"><div class="kpi"><span class="s">Ventas</span><span class="v">${money(d.ventas)}</span><span class="s">${num(d.piezas)} piezas</span></div>
      <div class="kpi"><span class="s">Ganancia aprox.</span><span class="v">${money(d.gan)}</span><span class="s">Precio menos costo</span></div>
      <div class="kpi"><span class="s">Compras</span><span class="v">${money(d.comp)}</span><span class="s">Entradas a costo</span></div>
      <div class="kpi ${d.fv?"bad":""}"><span class="s">Faltantes</span><span class="v">${d.fv?"−":""}${money(d.fv)}</span><span class="s">${num(d.fp)} piezas</span></div></div>
    <div class="card"><h2>Lo más vendido</h2>${top.map(([id,r])=>`<div style="display:flex;flex-direction:column;gap:5px"><div class="top" style="font-size:14px"><span style="font-weight:600;min-width:0;overflow-wrap:anywhere">${esc(nombreP(id))}</span><span class="num" style="font-weight:700;white-space:nowrap">${money(r.imp)}</span></div><div style="height:8px;border-radius:4px;background:var(--chip)"><div style="height:8px;border-radius:4px;width:${Math.max(4,Math.round(r.imp/max*100))}%;background:linear-gradient(90deg,var(--lila1),var(--rosa2))"></div></div><span class="s" style="font-size:12px;color:var(--muted)">${num(r.q)} piezas</span></div>`).join("") || '<p class="hint">Sin ventas en el periodo.</p>'}</div>
    <button class="btn btn-main wide" id="rExcel">${svg("excel",20)} Descargar Excel del periodo</button>
  </section>`;
}

/* ============ eventos por vista ============ */
function confirmar2(btn, texto, fn){ if(btn.dataset.armed!=="1"){ const t=btn.innerHTML; btn.dataset.armed="1"; btn.textContent=texto; setTimeout(()=>{ if(btn.isConnected){btn.dataset.armed=""; btn.innerHTML=t;} },3500); return; } fn(); }
function enlazar(){
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>confirmar2(b,"¿Seguro?",()=>{const [d,i]=b.dataset.undo.split("|"); borrarMov(d,i); toast("Movimiento eliminado"); render();}));
  const ex=$("btnExcelIni"); if(ex) ex.onclick=()=>{ ui.per="sem"; exportarExcel(); };
  if(vista==="vender"||vista==="entrada"){
    const vb=$("vBuscar");
    if(vb){ vb.oninput=()=>{ ui.vbuscar=vb.value; render(); };
      vb.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=vb.value.trim(); const hit=activos().find(([id,p])=>p.sku&&p.sku===v) || (activos().filter(([id,p])=>(p.nombre+" "+(p.sku||"")).toLowerCase().includes(v.toLowerCase())).length===1 && activos().filter(([id,p])=>(p.nombre+" "+(p.sku||"")).toLowerCase().includes(v.toLowerCase()))[0]);
        if(hit){ ui.vsel=hit[0]; ui.vqty=1; ui.vprecio=""; render(); } else toast("No encontré ese código"); } }; }
    document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ ui.vsel=b.dataset.pick; ui.vqty=1; ui.vprecio=""; render(); });
    if($("vOk")){
      const q=$("vQty"), pr=$("vPrecio");
      q.oninput=()=>{ ui.vqty=Math.max(1,parseInt(q.value,10)||1); };
      q.onchange=()=>render();
      pr.oninput=()=>{ ui.vprecio=pr.value; };
      pr.onchange=()=>render();
      $("vMenos").onclick=()=>{ ui.vqty=Math.max(1,ui.vqty-1); render(); };
      $("vMas").onclick=()=>{ ui.vqty+=1; render(); };
      $("vCancel").onclick=()=>{ ui.vsel=null; render(); setTimeout(()=>$("vBuscar")&&$("vBuscar").focus(),0); };
      $("vOk").onclick=()=>{ const p=prod(ui.vsel), venta=vista==="vender"; const precio=pr.value!==""?parseFloat(pr.value):(venta?+p.precio:+p.costo);
        const m={t:venta?"venta":"entrada", p:ui.vsel, q:ui.vqty, ts:Date.now(), costo: venta?(+p.costo||0):(isNaN(precio)?(+p.costo||0):precio)};
        if(venta) m.precio=isNaN(precio)?(+p.precio||0):precio; const nota=$("vNota").value.trim(); if(nota) m.nota=nota;
        agregarMovs([m]); toast(venta?`Venta registrada: ${money(m.precio*m.q)}`:"Entrada registrada"); ui.vsel=null; ui.vbuscar=""; render(); setTimeout(()=>$("vBuscar")&&$("vBuscar").focus(),0); };
    }
  }
  if(vista==="conteo"){
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ ui.cat=b.dataset.cat; render(); });
    document.querySelectorAll("[data-cin]").forEach(i=>i.oninput=()=>{ const id=i.dataset.cin; ui.borr[id]=i.value===""?undefined:String(Math.max(0,parseInt(i.value,10)||0)); if(i.value==="") delete ui.borr[id]; pillConteo(id); resumenConteo(); });
    const paso=(id,d)=>{ const cur=ui.borr[id]; const base=(cur===undefined||cur==="")?stockDe(id):+cur; ui.borr[id]=String(Math.max(0,base+d)); const i=$("c_"+id); if(i) i.value=ui.borr[id]; pillConteo(id); resumenConteo(); };
    document.querySelectorAll("[data-cmenos]").forEach(b=>b.onclick=()=>paso(b.dataset.cmenos,-1));
    document.querySelectorAll("[data-cmas]").forEach(b=>b.onclick=()=>paso(b.dataset.cmas,1));
    $("cGuardar").onclick=()=>{ const ids=Object.keys(ui.borr).filter(k=>ui.borr[k]!==""&&prod(k)); if(!ids.length) return; const ts=Date.now();
      const l=ids.map(id=>{const c=parseInt(ui.borr[id],10), s=stockDe(id); return {t:"conteo",p:id,esperado:s,contado:c,dif:c-s,costo:+prod(id).costo||0,ts};});
      agregarMovs(l); ui.borr={}; const f=l.filter(m=>m.dif<0).length; toast(f?`Conteo guardado: ${f} con faltante`:"Conteo guardado: todo cuadra"); render(); };
    resumenConteo();
  }
  if(vista==="productos"){
    const pb=$("pBuscar"); pb.oninput=()=>{ ui.pbuscar=pb.value; render(); };
    document.querySelectorAll("[data-pcat]").forEach(b=>b.onclick=()=>{ ui.pcat=b.dataset.pcat; render(); });
  }
  if(vista==="producto"){
    const leer=()=>{ const g=id=>$(id)?$(id).value:undefined; form.nombre=g("fNombre"); form.categoria=g("fCat"); form.sku=g("fSku"); form.costo=g("fCosto"); form.precio=g("fPrecio"); form.minimo=g("fMin");
      if($("fIni")) form.ini=g("fIni"); if($("fUni")) form.unidad=g("fUni"); form.proveedor=g("fProv"); form.notas=g("fNotas"); };
    $("fFoto").onclick=()=>{ leer(); $("fotoInput").click(); };
    if($("fQuitar")) $("fQuitar").onclick=()=>{ leer(); ui.foto=""; render(); };
    $("fGuardar").onclick=()=>{ leer(); if(!String(form.nombre||"").trim()){ toast("Escribe el nombre del producto"); $("fNombre").focus(); return; }
      const sku=String(form.sku||"").trim(); const dup=sku && activos().find(([id,p])=>id!==editId && p.sku===sku); if(dup){ toast("Ese código ya lo tiene: "+dup[1].nombre); return; }
      const data={nombre:form.nombre.trim(), categoria:(form.categoria||"").trim()||"Sin categoría", sku, costo:parseFloat(form.costo)||0, precio:parseFloat(form.precio)||0,
        minimo:parseInt(form.minimo,10)||0, unidad:(form.unidad||"pza").trim()||"pza", proveedor:(form.proveedor||"").trim(), notas:(form.notas||"").trim(), foto:ui.foto||"", activo:true};
      if(editId){ data.ejemplo=prod(editId).ejemplo; if(!data.ejemplo) delete data.ejemplo; st.productos[editId]=data; guardar(); recalcular(); toast("Cambios guardados"); ir("productos"); }
      else { const id="p"+uid(); st.productos[id]=data; const ini=parseInt(form.ini,10)||0; if(ini>0) agregarMovs([{t:"entrada",p:id,q:ini,costo:data.costo,ts:Date.now(),nota:"Existencia inicial"}]); else { guardar(); recalcular(); } toast("Producto agregado"); ir("productos"); } };
    if($("fBaja")) $("fBaja").onclick=function(){ confirmar2(this,"Confirmar: dar de baja",()=>{ st.productos[editId].activo=false; guardar(); recalcular(); toast("Producto dado de baja"); ir("productos"); }); };
  }
  if(vista==="surtir" && $("sCompartir")) $("sCompartir").onclick=async()=>{ const t=textoLista();
    if(navigator.share){ try{ await navigator.share({text:t}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(t); toast("Lista copiada. Pégala en WhatsApp."); }catch(e){ toast("No se pudo copiar automáticamente."); } };
  if(vista==="reportes"){ document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ ui.per=b.dataset.per; render(); }); $("rExcel").onclick=exportarExcel; }
  if(vista==="ajustes"){
    $("aGuardar").onclick=()=>{ const pin=$("aPin").value.trim(); if(pin && !/^\d{4,6}$/.test(pin)){ toast("El PIN debe tener de 4 a 6 números"); return; }
      aj.sucursal=$("aSuc").value.trim(); aj.nombre=$("aNom").value.trim(); aj.pin=pin; guardarAj(); toast("Ajustes guardados"); render(); };
    $("aResp").onclick=()=>descargar(new Blob([JSON.stringify({app:"inventario-nails",version:2,fecha:new Date().toISOString(),datos:st,ajustes:{sucursal:aj.sucursal,nombre:aj.nombre}})],{type:"application/json"}), `respaldo_inventario_${hoy()}.json`);
    $("aRest").onclick=()=>$("restoreInput").click();
    if($("aEj")) $("aEj").onclick=function(){ confirmar2(this,"Confirmar: borrar ejemplos",()=>{ const ej=new Set(Object.keys(st.productos).filter(id=>st.productos[id].ejemplo));
      for(const d in st.dias){ const m=st.dias[d].mov; for(const k in m) if(m[k].ejemplo||ej.has(m[k].p)) delete m[k]; if(!Object.keys(m).length) delete st.dias[d]; }
      ej.forEach(id=>delete st.productos[id]); guardar(); recalcular(); toast("Datos de ejemplo borrados"); render(); }); };
    $("aTodo").onclick=function(){ confirmar2(this,"Toca otra vez para borrar TODO",()=>{ st={productos:{},dias:{}}; guardar(); recalcular(); toast("Inventario vacío"); render(); }); };
  }
}

/* ============ fotos ============ */
function comprimir(file,max=360,q=0.72){ return new Promise((ok,mal)=>{ const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg",q)); };
  im.onerror=()=>{ URL.revokeObjectURL(url); mal(new Error("img")); }; im.src=url; }); }
$("fotoInput").addEventListener("change", async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  try{ ui.foto=await comprimir(f); render(); toast("Foto lista. Guarda el producto para conservarla."); }catch(err){ toast("No se pudo leer esa imagen. Prueba con otra foto."); } });
$("restoreInput").addEventListener("change", e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const d=j.datos||j; if(!d.productos||!d.dias) throw 0; st=d; if(j.ajustes){ aj.sucursal=j.ajustes.sucursal||aj.sucursal; aj.nombre=j.ajustes.nombre||aj.nombre; guardarAj(); }
    guardar(); recalcular(); toast("Respaldo restaurado"); render(); }catch(err){ toast("Ese archivo no es un respaldo válido de esta app."); } }; r.readAsText(f); });

/* ============ descargas y Excel ============ */
function descargar(blob, nombre){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),8000); }
function exportarExcel(){
  if(!window.XLSX){ toast("El generador de Excel aún no carga. Revisa tu internet e intenta de nuevo."); return; }
  const d=datosPeriodo();
  const hoja=(aoa,fs,w)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa); fs.forEach(([r,f])=>ws[r]={t:"n",f}); ws["!cols"]=w.map(x=>({wch:x})); return ws; };
  const inv=[["Producto","Categoría","Código","Unidad","Existencia","Mínimo","Costo","Precio","Valor a costo","Estado","Proveedor"]], fI=[];
  activos().forEach(([id,p],i)=>{ const r=i+2; inv.push([p.nombre,p.categoria,p.sku||"",p.unidad||"pza",stockDe(id),+p.minimo||0,+p.costo||0,+p.precio||0,null,estado(id)[0],p.proveedor||""]); fI.push(["I"+r,`MAX(E${r},0)*G${r}`]); });
  const nI=inv.length; inv.push(["TOTAL","","","",null,"","","",null]); fI.push(["E"+(nI+1),`SUM(E2:E${nI})`],["I"+(nI+1),`SUM(I2:I${nI})`]);
  const mv=[["Fecha","Hora","Tipo","Producto","Cantidad","Precio/Costo","Importe","Nota"]], fM=[];
  d.ms.filter(m=>m.t!=="conteo").forEach((m,i)=>{ const r=i+2; mv.push([m.dia,hora(m.ts),m.t==="venta"?"Venta":"Entrada",nombreP(m.p),+m.q,m.t==="venta"?(+m.precio||0):(+m.costo||0),null,m.nota||""]); fM.push(["G"+r,`E${r}*F${r}`]); });
  const fa=[["Fecha","Producto","Sistema","Contado","Diferencia","Costo","Valor diferencia"]], fF=[];
  d.ms.filter(m=>m.t==="conteo").forEach((m,i)=>{ const r=i+2; fa.push([m.dia,nombreP(m.p),+m.esperado,+m.contado,null,+m.costo||0,null]); fF.push(["E"+r,`D${r}-C${r}`],["G"+r,`E${r}*F${r}`]); });
  const cp=[["Producto","Existencia","Mínimo","Comprar","Costo unitario","Costo estimado","Proveedor"]], fC=[];
  porSurtir().forEach(([id,p],i)=>{ const r=i+2; cp.push([p.nombre,stockDe(id),+p.minimo||0,sugerido(id),+p.costo||0,null,p.proveedor||""]); fC.push(["F"+r,`D${r}*E${r}`]); });
  const nC=cp.length; cp.push(["TOTAL","","",null,"",null]); fC.push(["D"+(nC+1),`SUM(D2:D${nC})`],["F"+(nC+1),`SUM(F2:F${nC})`]);
  const rs=[["Inventario Nails"+(aj.sucursal?" · "+aj.sucursal:"")],["Periodo",`${d.de} a ${d.a}`],["Generado",new Date().toLocaleString("es-MX")],[],
    ["Ventas",null],["Piezas vendidas",null],["Compras (entradas a costo)",null],["Faltantes (valor a costo)",null],["Piezas faltantes",null],["Valor del inventario a costo",null],["Costo de la lista de compras",null]];
  const fR=[["B5",'SUMIF(Movimientos!C:C,"Venta",Movimientos!G:G)'],["B6",'SUMIF(Movimientos!C:C,"Venta",Movimientos!E:E)'],["B7",'SUMIF(Movimientos!C:C,"Entrada",Movimientos!G:G)'],
    ["B8",'-SUMIF(Faltantes!G:G,"<0")'],["B9",'-SUMIF(Faltantes!E:E,"<0")'],["B10",`Inventario!I${nI+1}`],["B11",`'Lista de compras'!F${nC+1}`]];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,hoja(rs,fR,[30,26]),"Resumen");
  XLSX.utils.book_append_sheet(wb,hoja(inv,fI,[36,18,16,8,11,9,10,10,14,11,18]),"Inventario");
  XLSX.utils.book_append_sheet(wb,hoja(mv,fM,[12,7,9,36,10,12,12,30]),"Movimientos");
  XLSX.utils.book_append_sheet(wb,hoja(fa,fF,[12,36,9,9,11,10,15]),"Faltantes");
  XLSX.utils.book_append_sheet(wb,hoja(cp,fC,[36,11,9,9,13,14,18]),"Lista de compras");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  descargar(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), `inventario_${d.de}_a_${d.a}.xlsx`);
  toast("Excel descargado");
}
